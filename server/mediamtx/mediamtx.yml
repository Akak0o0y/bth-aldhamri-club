# MediaMTX for مجلس ظمرة on Railway. start.sh fills the __PLACEHOLDERS__ from
# service variables, so no secret lives in the repo. WebRTC only.
logLevel: info
api: false
metrics: false
pprof: false
playback: false
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
# Railway has no public UDP, so ICE runs over TCP through Railway's TCP proxy.
# The candidate must carry the proxy's public host and port.
webrtcLocalUDPAddress: ""
webrtcLocalTCPAddress: :__ICE_PORT__
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [__ICE_HOST__]
webrtcICEServers2: []

# Streamer accounts live in the realtime relay: MediaMTX asks it (over
# Railway's private network) before each main-stream publish. Watching and
# opening a mic in the voice lounge never need an account.
authMethod: http
authHTTPAddress: __AUTH_URL__
authHTTPExclude:
  - action: read
  - action: playback
  - action: publish
    path: "~^[^/]+-voice-[0-9a-f]{8}$"

paths:
  all_others:
