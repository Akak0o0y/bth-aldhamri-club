name: Native broadcaster
on:
  push:
    branches: [main, 'codex/**']
    paths: ['tools/dhamri/**', 'tests/**', 'src/stream/**', 'dhamri.cmd', 'setup-dhamri.cmd', '.github/workflows/native-cli.yml']
  pull_request:
    paths: ['tools/dhamri/**', 'tests/**', 'src/stream/**', 'dhamri.cmd', 'setup-dhamri.cmd', '.github/workflows/native-cli.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dhamri/native/go.mod
          cache-dependency-path: tools/dhamri/native/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Check native helper
        working-directory: tools/dhamri/native
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath '-ldflags=-s -w' -o ../bin/dhamri-whip.exe .
      - name: Package Windows tool
        run: node tools/dhamri/package.mjs 0.1.0-rc3
      - uses: actions/upload-artifact@v4
        with:
          name: dhamri-windows
          path: |
            artifacts/dhamri-windows-0.1.0-rc3.zip
            artifacts/dhamri-windows-0.1.0-rc3.zip.sha256
